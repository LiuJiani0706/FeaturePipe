[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "featurepipe-reproduction"
version = "0.1.0"
description = "Auditable interview-grounded feature writing pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
featurepipe = "featurepipe.__main__:main"
[tool.setuptools.packages.find]
include = ["featurepipe*"]
